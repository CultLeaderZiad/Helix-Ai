name: Production Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Install dependencies
        run: npm ci

      - name: Strict Type Check
        run: npm run lint

      - name: Check Banned Copy
        run: npm run check:copy

      - name: Functional Audit
        run: npm test

      - name: Verify Tenant Isolation
        run: npm run verify:tenants

      - name: Verify CRM Boundaries
        run: npm run verify:crm
