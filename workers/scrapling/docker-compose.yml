services:
  scrapling-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: helix-ai-scrapling-worker:latest
    container_name: helix-scrapling-worker
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - leadgen_checkpoints:/tmp/helix-leadgen-checkpoints
    environment:
      PORT: "8080"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      SCRAPLING_ROBOTS_OBEY: "true"
      SCRAPLING_MAX_CONCURRENCY: "4"
      SCRAPLING_PROXY_LIST: "${SCRAPLING_PROXY_LIST:-}"
      HUNTER_API_KEY: "${HUNTER_API_KEY:-}"
      SCRAPLING_CHECKPOINT_DIR: "/tmp/helix-leadgen-checkpoints"

volumes:
  leadgen_checkpoints:
    driver: local
